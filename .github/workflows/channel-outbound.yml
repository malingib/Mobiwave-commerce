name: Channel outbound worker
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: commerce-outbound-worker
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Send queued Meta messages
        env:
          COMMERCE_BASE_URL: https://mobiwave-commerce.vercel.app
          CHANNEL_WORKER_SECRET: ${{ secrets.CHANNEL_WORKER_SECRET }}
        run: |
          if [ -z "$CHANNEL_WORKER_SECRET" ]; then
            echo "::error::Outbound worker secrets are not configured. Set the CHANNEL_WORKER_SECRET repository secret."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 75 \
            -X POST "${COMMERCE_BASE_URL%/}/api/internal/channels/send?limit=4" \
            -H "Authorization: Bearer $CHANNEL_WORKER_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
