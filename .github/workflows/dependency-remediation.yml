name: Dependency remediation
on:
  push:
    branches: ["codex/**"]
    paths:
      - "package.json"
      - "package-lock.json"

permissions:
  contents: write

jobs:
  lock-and-audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Generate and safely update dependency lockfile
        run: |
          npm install --package-lock-only --ignore-scripts
          npm audit fix
      - name: Commit lockfile and compatible dependency updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "security: lock and remediate npm dependencies"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Verify dependency security
        run: npm audit --audit-level=high
