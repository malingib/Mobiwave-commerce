name: Message outbox
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process queued transactional messages
        env:
          COMMERCE_BASE_URL: ${{ secrets.COMMERCE_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$COMMERCE_BASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::Message outbox secrets are not configured. Set COMMERCE_BASE_URL and CRON_SECRET."
            exit 1
          fi
          curl --fail --silent --show-error --max-time 45 \
            -X POST "${COMMERCE_BASE_URL%/}/api/internal/messages/process" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
