name: Message outbox
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Process queued transactional messages
        env:
          COMMERCE_BASE_URL: ${{ secrets.COMMERCE_BASE_URL }}
          COMMERCE_CRON_SECRET: ${{ secrets.COMMERCE_CRON_SECRET }}
        run: |
          if [ -z "$COMMERCE_BASE_URL" ] || [ -z "$COMMERCE_CRON_SECRET" ]; then
            echo "Message outbox secrets are not configured; skipping."
            exit 0
          fi
          curl --fail --silent --show-error --max-time 45 \
            -X POST "${COMMERCE_BASE_URL%/}/api/internal/messages/process" \
            -H "Authorization: Bearer $COMMERCE_CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d '{}'
